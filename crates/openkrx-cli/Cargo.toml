[package]
name = "openkrx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "openkrx: inspect, list, validate-structure and extract Hungarian KRX packages"

[lints]
workspace = true

[[bin]]
name = "openkrx"
path = "src/main.rs"

[dependencies]
openkrx-core = { path = "../openkrx-core" }
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde.workspace = true
serde_json.workspace = true

# Unix only: an extraction resolves every destination path from one directory
# descriptor rather than by name, and no portable standard-library call opens
# a path relative to a descriptor at all. `openat2` with `RESOLVE_BENEATH` on
# Linux and the `*at` calls the component walk is made of elsewhere both come
# from here. `default-features = false` keeps the `linux_raw` backend on
# Linux, so no C library is linked there, and the two features are the
# filesystem calls and the `std` types they are handed. See
# `docs/research.md`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The subprocess tests build every package they read from the core crate's
# test-only writer. No binary fixture is committed and no released build
# enables that feature.
openkrx-core = { path = "../openkrx-core", features = ["synthetic-writer"] }
