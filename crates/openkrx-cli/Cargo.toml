[package]
name = "openkrx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "openkrx: inspect, list, validate-structure and extract Hungarian KRX packages"

[lints]
workspace = true

[[bin]]
name = "openkrx"
path = "src/main.rs"

[dependencies]
openkrx-core = { path = "../openkrx-core" }
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde.workspace = true
serde_json.workspace = true

# Linux only: `openat2` with `RESOLVE_BENEATH` is what makes an extraction's
# path resolution race-resistant, and no portable standard-library call
# offers it. `default-features = false` keeps the `linux_raw` backend, so no
# C library is linked, and the two features are the filesystem calls and the
# `std` types they are handed. See `docs/research.md`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The subprocess tests build every package they read from the core crate's
# test-only writer. No binary fixture is committed and no released build
# enables that feature.
openkrx-core = { path = "../openkrx-core", features = ["synthetic-writer"] }
