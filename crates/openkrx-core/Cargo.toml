[package]
name = "openkrx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded KRX (OCD+ZIP) package reading, structural checks and extraction planning"

[lints]
workspace = true

[features]
# Test-only synthetic ZIP and metadata writers, used by this crate's own tests
# and by the command-line crate's subprocess tests. Never enabled by a binary.
synthetic-writer = []

# The generator behind the committed golden fixtures. It is an example rather
# than a test because it writes files a human then commits, and it needs the
# same test-only writer, so it is built only with that feature enabled.
[[example]]
name = "golden_fixtures"
required-features = ["synthetic-writer"]

# The generator behind the limit measurement's packages. It is an example for
# the same reasons: it writes files a tool outside the repository then reads,
# and it needs the same test-only writer.
[[example]]
name = "limit_packages"
required-features = ["synthetic-writer"]

[dependencies]
miniz_oxide.workspace = true
quick-xml.workspace = true
serde.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# The crate's own integration tests build synthetic archives with the
# test-only writer, which no default build compiles.
openkrx-core = { path = ".", features = ["synthetic-writer"] }
# The property-based round-trip tests, and this crate alone: no binary and no
# other crate carries it. Default features are off because `fork` and `timeout`
# pull in `rusty-fork`, `tempfile` and `wait-timeout` for a process-per-case
# harness nothing here uses; `std` is all the properties need. It does not drop
# `regex-syntax`: proptest's `std` feature enables that one, so the regex
# strategies come along whatever this line says.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# The benchmarks under `benches/`, and nothing else: no binary, no test and no
# other crate carries it. Default features are off because `rayon` and
# `plotters` pull a thread pool and a plotting stack in for reports nothing
# here reads; `cargo_bench_support` is the one default kept, because without it
# criterion refuses to run under `cargo bench` at all. Its declared minimum
# Rust is 1.86, inside the workspace's 1.88.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }

# One target per layer, each with criterion's own harness rather than libtest's.
# See `docs/testing.md`, "Benchmarks".
[[bench]]
name = "reader"
harness = false

[[bench]]
name = "planner"
harness = false

[[bench]]
name = "writer"
harness = false
