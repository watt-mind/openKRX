name: Fuzz campaign

# Deliberately NOT a required check. `.github/workflows/ci.yml` keeps the
# pull-request lane: five targets, 30 seconds each, enough to prove every
# harness still links and executes. This workflow is the other half — a long
# run from a seeded corpus, off the pull-request path — and a crash it finds
# is a defect to triage under
# [fuzz/regressions/README.md](../../fuzz/regressions/README.md), not a merge
# block. It must not be added to the repository's required status checks.
#
# The corpus is cumulative. Each target's `fuzz/corpus/<target>/` is restored
# from the previous campaign's `actions/cache` entry, seeded on top, fuzzed for
# the budget, then minimised with `cargo fuzz cmin` and saved as this
# campaign's entry, so week n+1 starts from everything week n reached instead
# of from the fixtures alone. A maintainer discards the accumulation by
# bumping `CORPUS_CACHE_VERSION` below.
#
# See docs/testing.md, "Fuzzing", for the seed corpus, the local campaign and
# how a crash is handled.

on:
  schedule:
    # 05:00 UTC every Monday: an hour after the mutation lane (mutants.yml),
    # so the two weekly campaigns do not queue against each other.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      minutes_per_target:
        description: >-
          Wall-clock budget for each of the five targets, in minutes (1-240).
        type: number
        default: 20
  # GitHub registers a `workflow_dispatch` workflow only from the default
  # branch, so a brand-new workflow cannot be dispatched from the branch that
  # adds it — release.yml carries the same note. This trigger is how the lane
  # is rehearsed before it lands: a pull request touching the workflow or the
  # seeding script runs the identical job at a 2-minute budget. The filter is
  # deliberately just these two files; every ordinary pull request is served
  # by ci.yml's 30-second lane.
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/seed.py"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  campaign:
    name: Fuzz campaign (five targets)
    runs-on: ubuntu-latest
    # The scheduled budget is 5 x 20 minutes of fuzzing plus the build, the
    # seeding and the coverage pass. The bound is generous rather than tight:
    # it exists to stop a runaway job, and a `workflow_dispatch` asking for a
    # budget this cannot fit is the caller's own arithmetic to do.
    timeout-minutes: 360
    env:
      # The Rust target triple the fuzz binaries are built for, not the name
      # of a fuzz target: those are `inventory`, `xml_metadata`, `structure`,
      # `extract_plan` and `create_round_trip`, named below. cargo-fuzz
      # otherwise defaults to the triple of its own binary, and the pre-built
      # one is a musl build, which AddressSanitizer cannot link against.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      # The reset knob for the cumulative corpus. Every cache key below is
      # prefixed with it, so bumping it to `v2` makes every restore miss and
      # the next campaign start from the seeds alone — which is what a
      # maintainer wants after a change to what an input means (a limit, a
      # harness, a target's entry point), when the accumulated inputs are
      # exploring a shape the reader no longer has. Nothing is deleted: the
      # old entries simply stop being addressed and expire on GitHub's own
      # schedule.
      CORPUS_CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: nightly
          # `cargo fuzz coverage` needs llvm-profdata to merge the raw
          # profiles, and llvm-cov to render them. Both ship in this
          # component, and it installs cleanly on the nightly toolchain — the
          # coverage step below is therefore an ordinary step whose failure
          # fails the job, not a best-effort one.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-fuzz@0.13.2
      # The same gate ci.yml runs: `cargo fuzz` accepts none of cargo's
      # manifest flags, so `--locked` reaches neither `fuzz build` nor
      # `fuzz run`. Resolving the graph with `cargo metadata --locked` first
      # fails on an absent or stale `fuzz/Cargo.lock`, and the build that
      # follows reuses that lockfile unchanged.
      - name: Enforce the fuzz lockfile
        run: cargo +nightly metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Resolve the per-target budget
        id: budget
        env:
          EVENT_NAME: ${{ github.event_name }}
          MINUTES_INPUT: ${{ inputs.minutes_per_target }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # A rehearsal of the workflow itself, not a campaign.
            minutes=2
          else
            minutes="${MINUTES_INPUT:-20}"
          fi
          case "$minutes" in
            ''|*[!0-9]*)
              echo "::error::minutes_per_target must be a whole number of minutes, got '${minutes}'"
              exit 1
              ;;
          esac
          if [ "$minutes" -lt 1 ]; then
            echo "::error::minutes_per_target must be at least 1"
            exit 1
          fi
          # An upper bound on a typo — 2000 dispatched for 20 — which the job
          # timeout would otherwise catch hours later by cancelling the job,
          # taking the corpus and the coverage report with it. 240 is four
          # hours, more than the whole scheduled campaign spends fuzzing, and
          # well past any budget the 360-minute timeout can fit five of; a
          # larger request is refused here rather than clamped, so a caller who
          # asked for more knows they did not get it. The timeout remains the
          # real bound: fitting five targets inside it is still the caller's
          # own arithmetic to do.
          if [ "$minutes" -gt 240 ]; then
            echo "::error::minutes_per_target is capped at 240; got '${minutes}'"
            exit 1
          fi
          echo "seconds=$((minutes * 60))" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "Budget: ${minutes} minute(s) per target, five targets."
      # The cache key is per target and per ISO week, with the run id appended
      # so every campaign writes a new entry rather than colliding with the
      # one it restored — `actions/cache/save` refuses to overwrite a key that
      # already exists, and a second run in the same week would otherwise
      # throw its work away. The restore keys below do the reading: the
      # week-prefix first, then the target prefix, and a prefix match returns
      # the most recently created entry, which is the latest campaign's
      # minimised corpus.
      - name: Resolve the corpus cache key
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          week=$(date -u +%G-W%V)
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "Corpus cache generation: ${CORPUS_CACHE_VERSION}, week ${week}."
      - name: Restore the inventory corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/inventory
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-inventory-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-inventory-${{ steps.corpus.outputs.week }}-
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-inventory-
      - name: Restore the xml_metadata corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/xml_metadata
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-xml_metadata-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-xml_metadata-${{ steps.corpus.outputs.week }}-
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-xml_metadata-
      - name: Restore the structure corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/structure
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-structure-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-structure-${{ steps.corpus.outputs.week }}-
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-structure-
      - name: Restore the extract_plan corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/extract_plan
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-extract_plan-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-extract_plan-${{ steps.corpus.outputs.week }}-
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-extract_plan-
      - name: Restore the create_round_trip corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/create_round_trip
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-create_round_trip-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-create_round_trip-${{ steps.corpus.outputs.week }}-
            fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-create_round_trip-
      # libFuzzer starts from whatever `fuzz/corpus/<target>/` already holds —
      # here, whatever the restore above put there, which on the first run of a
      # new cache generation is nothing. Seeding from the committed golden
      # fixtures is what makes a long run start deep: the first execution
      # already carries a well-formed package and a real metadata document
      # rather than a handful of random bytes. The script writes its seeds by
      # name and overwrites only its own, so it lands *on top of* a restored
      # corpus without disturbing anything libFuzzer added.
      - name: Build the seed corpus
        run: |
          python3 fuzz/seed.py
          python3 fuzz/seed.py --verify
      # Measured after the restore and the seeding, so the "before" column is
      # what this campaign actually starts from; the matching "after" column is
      # taken once the run and the minimisation are done.
      - name: Record the corpus size before the campaign
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/corpus-before.txt"
          for target in inventory xml_metadata structure extract_plan create_round_trip; do
            directory="fuzz/corpus/${target}"
            files=$(find "$directory" -type f | wc -l)
            bytes=$(du -sb "$directory" | cut -f1)
            printf '%s %s %s\n' "$target" "$files" "$bytes" >> "${RUNNER_TEMP}/corpus-before.txt"
          done
          cat "${RUNNER_TEMP}/corpus-before.txt"
      - run: cargo +nightly fuzz build --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE"
      - name: Run every target for the budget
        env:
          SECONDS_PER_TARGET: ${{ steps.budget.outputs.seconds }}
        shell: bash
        run: |
          set -euo pipefail
          for target in inventory xml_metadata structure extract_plan create_round_trip; do
            echo "::group::${target}"
            cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
              "$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      # `cargo fuzz cmin` is libFuzzer's `-merge=1` with the bookkeeping done
      # for it: it merges the corpus into a fresh directory, keeping only the
      # inputs that contribute a feature no earlier input already covers, and
      # replaces the corpus with that directory. Coverage is preserved by
      # construction while the input count and the bytes fall, which is what
      # keeps a corpus that is carried forward every week from growing without
      # bound — and what keeps the next campaign's restore, seeding and first
      # pass cheap.
      - name: Minimise every corpus
        shell: bash
        run: |
          set -euo pipefail
          for target in inventory xml_metadata structure extract_plan create_round_trip; do
            echo "::group::cmin ${target}"
            cargo +nightly fuzz cmin --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
              "$target" -- -rss_limit_mb=2048
            echo "::endgroup::"
          done
      # Reporting must not be able to lose a campaign. This step sits between
      # the minimisation and the five saves, so under an unguarded
      # `set -euo pipefail` a directory that had gone missing or unreadable
      # would fail `du`, skip every save, and throw away hours of accumulated
      # inputs over a number in a table. Every measurement therefore falls back
      # to 0 and a missing directory is reported as such: a zero in this table
      # is a signal to read the log, not a reason to discard the corpus.
      - name: Report the corpus size before and after
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Corpus size per target"
            echo
            echo "| Target | Inputs before | Bytes before | Inputs after | Bytes after |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r target files bytes; do
            directory="fuzz/corpus/${target}"
            if [ -d "$directory" ]; then
              after_files=$( { find "$directory" -type f 2>/dev/null || true; } | wc -l )
              after_bytes=$( { du -sb "$directory" 2>/dev/null || echo 0; } | cut -f1 )
            else
              echo "::warning::no corpus directory for ${target} after minimisation"
              after_files=0
              after_bytes=0
            fi
            printf "| \`%s\` | %s | %s | %s | %s |\n" \
              "$target" "$files" "$bytes" "${after_files:-0}" "${after_bytes:-0}" \
              >> "$GITHUB_STEP_SUMMARY"
          done < "${RUNNER_TEMP}/corpus-before.txt"
      # Saved before the coverage pass rather than after it: coverage is an
      # ordinary step whose failure fails the job, and a failure there must not
      # cost the campaign the corpus it just spent hours growing. Not on the
      # pull-request path — a rehearsal restores the real corpus to prove the
      # wiring, but what it produces in two minutes per target is not what the
      # next campaign should start from.
      - name: Save the inventory corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/inventory
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-inventory-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
      - name: Save the xml_metadata corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/xml_metadata
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-xml_metadata-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
      - name: Save the structure corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/structure
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-structure-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
      - name: Save the extract_plan corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/extract_plan
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-extract_plan-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
      - name: Save the create_round_trip corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/create_round_trip
          key: fuzz-corpus-${{ env.CORPUS_CACHE_VERSION }}-create_round_trip-${{ steps.corpus.outputs.week }}-${{ github.run_id }}
      # One target only, and only off the pull-request path: replaying an
      # accumulated corpus through an instrumented build costs another build
      # and another pass over every input, which a rehearsal does not need.
      # `inventory` is the entry point every other package target goes
      # through, so its report is the one that says what the campaign reached.
      - name: Measure coverage for the inventory target
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fuzz coverage --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" inventory
          # cargo-fuzz builds the instrumented binary under a `coverage`
          # directory of its own and merges the raw profiles itself; it
          # renders no report, so llvm-cov from the toolchain's own
          # llvm-tools does that here. The binary is located rather than
          # hard-coded: the path carries the triple twice and is cargo-fuzz's
          # to change. `-print -quit` rather than `| head -1`: under
          # `pipefail` a second match would make find write to a closed pipe
          # and fail the step with SIGPIPE before the explicit guard below
          # could report anything useful.
          binary=$(find target -type f -path "*/coverage/*/release/inventory" -print -quit)
          if [ -z "$binary" ]; then
            echo "::error::no instrumented inventory binary was produced under target/"
            exit 1
          fi
          llvm_bin="$(rustc +nightly --print sysroot)/lib/rustlib/${FUZZ_TARGET_TRIPLE}/bin"
          "$llvm_bin/llvm-cov" report "$binary" \
            -instr-profile=fuzz/coverage/inventory/coverage.profdata \
            -ignore-filename-regex='/rustc/|/\.cargo/registry' \
            | tee fuzz/coverage/inventory/report.txt
          {
            echo "### Coverage reached by the \`inventory\` corpus"
            echo
            echo '```'
            cat fuzz/coverage/inventory/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Always, including on a crash: the artifacts directory holds the
      # crashing input, and the corpus is what a maintainer replays it
      # against. Neither is committed — `fuzz/.gitignore` ignores both. The
      # upload stays even though the corpus is now cached as well: the cache is
      # the campaign-to-campaign carrier, readable only by a workflow run,
      # while this artifact is the downloadable copy — and on a crash it is the
      # only copy at all, because the save steps above do not run when a target
      # fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-campaign
          # Documented exception to the one-day retention baseline (owner:
          # repository maintainer): this campaign runs weekly, its evidence
          # must outlive the next scheduled run, and when a campaign fails
          # this artifact is the only surviving copy of the corpus.
          retention-days: 14
          if-no-files-found: warn
          path: |
            fuzz/artifacts
            fuzz/corpus
            fuzz/coverage
