name: CI
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-machete@0.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo machete
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#target" "#node_modules"
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/check-file-length.py
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Release CLI smoke
        shell: bash
        run: |
          target/release/openkrx --help
          target/release/openkrx --version
          target/release/openkrx capabilities --json
  golden:
    name: Golden output contract
    # The files under tests/golden/ are the machine-checked form of the JSON
    # envelope, of the human renderer's lines, and of the exit statuses. A
    # diff here is a change to what every consumer parses, so it fails the
    # pull request and is reviewed as a contract change under the
    # schema_version rule rather than regenerated to make the build green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p openkrx-cli
      - name: Check the golden output contract
        run: python3 scripts/golden.py check --bin target/release/openkrx
      # The committed fixtures must stay the generator's own output, so a
      # hand-edited package cannot quietly become the contract.
      - name: Verify the committed fixtures
        run: python3 scripts/golden.py verify-fixtures
  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `rust-toolchain.toml` pins `channel = "stable"`, and a toolchain file
      # overrides the rustup default for every cargo and rustc call inside the
      # checkout — so installing 1.88 and making it the default was not enough,
      # and this job used to compile on current stable. `RUSTUP_TOOLCHAIN` is
      # the one override that beats the toolchain file, so it is set for the
      # whole job: every step below, including `Swatinem/rust-cache` (which
      # keys its cache on the toolchain in use), sees 1.88.0. The value is the
      # full `1.88.0`, which is the name the pinned action below installs, so
      # rustup resolves it directly instead of auto-installing a second copy
      # under the `1.88` name. The version step is the evidence — it must
      # print 1.88.0, not the current stable.
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This pin is the action's `1.88` version branch: its action.yml hard-codes
      # the toolchain and declares no `toolchain` input, so passing one is
      # unsupported. The version step below records the toolchain `cargo`
      # actually resolves to in this job: `rust-toolchain.toml` pins stable and
      # would override the rustup default, so the job-level `RUSTUP_TOOLCHAIN`
      # env above forces 1.88.0.
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88 @ 2026-09-03
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 90
  fuzz:
    name: Fuzz (build only)
    # The fuzz package is its own workspace on a nightly toolchain, so nothing
    # here is covered by the stable jobs above. Each of the five targets then
    # runs for a bounded 30 seconds — a 150-second total fuzzing budget, long
    # enough to prove every harness executes and to catch a shallow regression,
    # short enough to keep the pull-request lane cheap. Deep campaigns are a
    # local or scheduled activity, not this job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Rust target triple the fuzz binaries are built for, not the name of
      # a fuzz target: those are `inventory`, `xml_metadata`, `structure`,
      # `extract_plan` and `create_round_trip`, named below.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-fuzz@0.13.2
      # cargo-fuzz defaults `--target` to the triple of its own binary, and
      # install-action falls back to cargo-binstall for this version, which
      # ships a musl build. AddressSanitizer cannot link against a static
      # libc, so the target is named explicitly rather than inherited.
      # `cargo fuzz` accepts none of cargo's manifest flags, so `--locked`
      # reaches neither `fuzz build` nor `fuzz run` — both reject it outright.
      # Resolving the same graph with `cargo metadata --locked` first is the
      # equivalent: it fails when `fuzz/Cargo.lock` is absent or stale, and
      # the build that follows then reuses that lockfile unchanged.
      - name: Enforce the fuzz lockfile
        run: cargo +nightly metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - run: cargo +nightly fuzz build --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE"
      # Every retained crash, replayed on every push. `fuzz/regressions/<target>/`
      # holds the minimised inputs that could not be expressed as a generated
      # construction in a `*_rejects_*.rs` test — the rule is in
      # fuzz/regressions/README.md — and this step is what stops one of them
      # coming back: the directory is passed as the corpus and `-runs=0` adds no
      # mutation, so libFuzzer executes each file in it once and exits, and a
      # crash fails the job. Replaying is not fuzzing and costs about what the
      # process starts cost, so the step carries its own five-minute bound on
      # top of the job's twenty.
      #
      # A target whose directory holds nothing but `.gitkeep` is skipped rather
      # than replayed: libFuzzer would otherwise execute the placeholder as an
      # input, which is harmless but reads in the log as a regression that was
      # checked when there was none. Today every directory is in that state — no
      # crash has ever been found — so this step reports five skips and passes;
      # the moment a blob lands it starts guarding it, with no edit here.
      - name: Replay the retained regressions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          replayed=0
          for target in inventory xml_metadata structure extract_plan create_round_trip; do
            directory="fuzz/regressions/${target}"
            count=$(find "$directory" -type f ! -name '.gitkeep' | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "${target}: no retained regressions"
              continue
            fi
            echo "::group::${target}: replaying ${count} retained input(s)"
            cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
              "$target" "$directory" -- -runs=0 -rss_limit_mb=2048
            echo "::endgroup::"
            replayed=$((replayed + count))
          done
          echo "Replayed ${replayed} retained regression input(s)."
      # libFuzzer starts from whatever `fuzz/corpus/<target>/` holds, and a
      # fresh checkout holds nothing: an unseeded 30-second run spends itself
      # rediscovering that a package is a ZIP container at all. Seeding from
      # the committed golden fixtures puts a well-formed package and a real
      # metadata document in front of the mutator on the first execution, so
      # the same 30 seconds start deep. The budget below is unchanged.
      - name: Build the seed corpus
        run: |
          python3 fuzz/seed.py
          python3 fuzz/seed.py --verify
      - name: Bounded run of each target
        run: |
          cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
            inventory -- -max_total_time=30 -rss_limit_mb=2048
          cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
            xml_metadata -- -max_total_time=30 -rss_limit_mb=2048
          cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
            structure -- -max_total_time=30 -rss_limit_mb=2048
          cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
            extract_plan -- -max_total_time=30 -rss_limit_mb=2048
          cargo +nightly fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" \
            create_round_trip -- -max_total_time=30 -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 1
          if-no-files-found: ignore
  hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" |
            while IFS= read -r subject; do
              printf '%s\n' "$subject" | sh scripts/commit-msg.sh -
            done
  api-compat:
    name: API compatibility (informational)
    # A report, not a gate. Neither crate is published, so no downstream build
    # can break yet and nothing here belongs in the required checks; this job
    # exists so that an accidental change to `openkrx-core`'s public API is
    # visible in the pull request while that is still cheap to reconsider.
    # `continue-on-error: true` below keeps a finding from failing the run, and
    # the job is deliberately absent from the repository's required-check list.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The workflow-level `RUSTFLAGS: -D warnings` is dropped here on purpose:
      # this job also compiles the *baseline* commit, which is code this pull
      # request did not write and cannot fix. A warning there would abort the
      # comparison instead of reporting on it. Every other job still builds the
      # working tree with warnings denied.
      RUSTFLAGS: ''
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # `--baseline-rev` resolves a commit in this clone, so the default
      # single-commit fetch is not enough: the base commit must be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the core crate changed
        id: scope
        # The manifest and the lockfile are in the pathspec beside the crate's
        # own sources: a dependency bump can move a type this crate re-exports
        # or derives on, which changes the public API without touching a line
        # under `crates/openkrx-core`.
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- crates/openkrx-core Cargo.toml Cargo.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        if: steps.scope.outputs.changed == 'true'
        with:
          # `rust-toolchain.toml` pins the same channel; naming it here only
          # makes the job install it before the toolchain file asks for it.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.changed == 'true'
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        if: steps.scope.outputs.changed == 'true'
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Compare the public API against the base commit
        id: report
        if: steps.scope.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/api-check.sh "$BASE_SHA" 2>&1 | tee "$RUNNER_TEMP/api-report.txt"
      - name: Publish the report
        if: always()
        env:
          CHANGED: ${{ steps.scope.outputs.changed }}
          OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## API compatibility (informational)'
            echo
            if [ "$CHANGED" != 'true' ]; then
              echo "SKIPPED: \`crates/openkrx-core\`, \`Cargo.toml\` and \`Cargo.lock\` are unchanged against the base commit, so there is no public API to compare."
            else
              case "$OUTCOME" in
                success)
                  echo "PASS: \`cargo-semver-checks\` found no breaking change in the public API of \`openkrx-core\` against the base commit."
                  ;;
                failure)
                  echo "BREAK: \`cargo-semver-checks\` reported a public API change in \`openkrx-core\` against the base commit. It does not fail the build, because nothing is published and there is no downstream build to break; the report below is what one would have seen."
                  ;;
                *)
                  # `skipped` or `cancelled`: the toolchain, the cache or the
                  # install did not get as far as running the comparison, so
                  # there is no result to report either way. The job stays
                  # green, because an informational report that could not run
                  # is not a finding about this pull request.
                  echo 'NOT RUN: setup failed before the comparison, so nothing was compared. This is not a finding about the public API; see the job log for the step that failed.'
                  ;;
              esac
              echo
              # Absent whenever the comparison never ran, and `set -e` would
              # otherwise turn that into a red informational job.
              if [ -f "$RUNNER_TEMP/api-report.txt" ]; then
                echo '<details><summary>cargo-semver-checks output</summary>'
                echo
                echo '```text'
                cat "$RUNNER_TEMP/api-report.txt"
                echo '```'
                echo
                echo '</details>'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
