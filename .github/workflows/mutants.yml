name: Mutation testing

# Deliberately NOT a required check, and deliberately not on pull requests.
# A full workspace run rebuilds and reruns the suite once per mutant: 937
# rebuilds for about eight minutes of wall time at `--jobs 2`, and a cost that
# grows with every function added. That is far past what a pull-request build
# should cost, on top of every job ci.yml already runs. The weekly
# schedule tracks test *strength* the way ci.yml's coverage job tracks line
# coverage, but on its own budget: a failure here is a signal to strengthen
# tests, not a merge block, so this workflow must not be added to the
# repository's required status checks.
#
# See docs/testing.md, "Mutation testing", for how to run it locally, how to
# read the survivors, and when to update `scripts/mutants-floors.txt`.

on:
  schedule:
    # 04:00 UTC every Monday: clear of the weekly security scan's own cron
    # (security.yml) and of any weekday push-triggered CI queue.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation test (workspace)
    runs-on: ubuntu-latest
    # The local seeding run tested all 937 workspace mutants in 7 minutes
    # 39 seconds at `--jobs 2` — most mutants rebuild incrementally in under a
    # second and the suite itself runs in about one. Two mutants that loop
    # forever spend `minimum_test_timeout` (120 s) each, and that floor is
    # what a cold, slower runner pays for too, so the bound below is generous
    # rather than tight: it exists to stop a runaway job, not to model the run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-mutants@27.1.0
      # `cargo mutants` exits non-zero when mutants survive, which is the
      # normal outcome this workflow exists to measure, so its status is
      # captured rather than allowed to end the job: the gate below decides.
      # `.cargo/mutants.toml` supplies the exclusions and the timeouts, and
      # the default output location is `./mutants.out`, which is what the
      # gate reads and what the artifact step uploads.
      - name: Run cargo-mutants
        id: mutants
        shell: bash
        run: |
          set +e
          cargo mutants --workspace --jobs 2
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Run the mutation-testing gate
        id: gate
        shell: bash
        run: |
          set +e
          python3 scripts/mutants_gate.py --dir mutants.out | tee mutants-gate-summary.md
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-out
          # Documented exception to the one-day retention baseline (owner:
          # repository maintainer): this campaign runs weekly, its evidence
          # must outlive the next scheduled run, and the report is what the
          # per-crate mutation floor decisions are made from.
          retention-days: 14
          if-no-files-found: warn
          path: |
            mutants.out
            mutants-gate-summary.md
      # cargo-mutants uses 2 for "some mutants survived" and 3 for "some
      # timed out"; both are results the gate judges. Any other non-zero
      # status is a broken run — a build failure, a bad configuration — and
      # is surfaced as such rather than read as a mutation score.
      - name: Report the result
        shell: bash
        run: |
          status="${{ steps.mutants.outputs.status }}"
          case "$status" in
            0|2|3) ;;
            *)
              echo "::error::cargo mutants exited with status $status, which is a failed run rather than surviving mutants"
              exit 1
              ;;
          esac
          if [ "${{ steps.gate.outputs.status }}" != "0" ]; then
            echo "::error::scripts/mutants_gate.py reported a crate below its floor; see the job summary or the mutants-out artifact"
            exit 1
          fi
