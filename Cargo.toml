[workspace]
members = ["crates/openkrx-core", "crates/openkrx-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/watt-mind/openKRX"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = { version = "4.6.9", default-features = false }
clap_mangen = { version = "0.3.3", default-features = false }
miniz_oxide = "0.9.1"
quick-xml = { version = "0.42.0", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
unicode-normalization = "0.1.25"
